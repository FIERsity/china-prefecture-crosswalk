[project]
name = "china-prefecture-crosswalk"
version = "4.0.1"
requires-python = ">=3.10"
dependencies = ["streamlit==1.41.1", "pandas>=2.1,<3", "openpyxl>=3.1,<4", "rapidfuzz>=3.6,<4", "opencc-python-reimplemented>=0.1.7,<1"]

[project.optional-dependencies]
geo = ["pyshp>=2.3,<3", "shapely>=2.0,<3", "pyproj>=3.6,<4"]

[project.scripts]
cnur = "urban_crosswalk.cli:main"

[tool.setuptools]
packages = ["urban_crosswalk"]

[tool.setuptools.package-data]
urban_crosswalk = ["data/*.csv"]

[tool.pytest.ini_options]
pythonpath = ["."]
